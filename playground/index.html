<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Reveal Playground</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <section class="toolbar" aria-label="Controles de animacion">
      <label>
        SVG
        <input id="svgFile" type="file" accept=".svg,image/svg+xml">
      </label>

      <label>
        Tiempo T (seg)
        <input id="duration" type="number" min="0.1" step="0.1" value="4">
      </label>

      <label>
        Letras pl (%)
        <input id="letterPercent" type="number" min="0" max="100" step="1" value="20">
      </label>

      <button id="replay" type="button" disabled>Repetir</button>
      <div id="status" class="status" role="status">Elegi un archivo SVG para probar la animacion.</div>
    </section>

    <section id="stage" class="stage" aria-live="polite">
      <p class="empty">El SVG cargado se va a mostrar aca.</p>
    </section>
  </main>

  <script type="module" src="./playground.js"></script>
</body>
</html>
